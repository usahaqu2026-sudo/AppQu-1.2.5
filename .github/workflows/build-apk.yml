name: Build & Auto-Release Android APK (AppQu & BaksoQu)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Versi Rilis Kustom (contoh: 1.2.3)'
        required: false
        default: ''
      release_notes:
        description: 'Catatan Rilis Tambahan'
        required: false
        default: 'Pembaruan otomatis build APK, performa, dan fitur terkini.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK, Auto Version & Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Hitung Versi Otomatis (Auto Versioning)
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          
          # Baca versi dasar dari package.json (default fallback: 1.2.2)
          BASE_PKG_VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.2.2")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_PKG_VER"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-2}
          PATCH=${PATCH:-2}

          # Penentuan nama versi rilis:
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            echo "🏷️ Mode: Git Tag Push (${RAW_TAG})"
          elif [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VER_NAME="${{ github.event.inputs.custom_version }}"
            echo "⚡ Mode: Manual Dispatch Custom Version (${VER_NAME})"
          else
            # Monotonic SemVer increment per push to main/master
            CALC_PATCH=$((PATCH + RUN_NUM))
            VER_NAME="${MAJOR}.${MINOR}.${CALC_PATCH}"
            echo "🚀 Mode: Auto Version Push (${VER_NAME})"
          fi

          # Hitung Version Code integer unik & strictly increasing untuk Android
          VER_CODE=$((1000 + RUN_NUM))
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")

          echo "VERSION_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "📌 AUTO-VERSION DIHASILKAN:"
          echo "   Version Name : ${VER_NAME}"
          echo "   Version Code : ${VER_CODE}"
          echo "   Build Date   : ${BUILD_DATE}"
          echo "   Git Commit   : ${SHORT_SHA}"
          echo "=========================================="

      - name: 3. Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Set up JDK 21 dengan Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 5. Sinkronisasi Versi & Buat version.json
        run: |
          # Siapkan .env
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Sinkronisasi ke package.json
          npm version "${{ env.VERSION_NAME }}" --no-git-tag-version --allow-same-version || true

          mkdir -p public dist
          cat << EOF > public/version.json
          {
            "version": "${{ env.VERSION_NAME }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "buildDate": "${{ env.BUILD_DATE }}",
            "commit": "${{ env.SHORT_SHA }}",
            "repo": "${{ github.repository }}",
            "apkFileName": "AppQu-v${{ env.VERSION_NAME }}.apk",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/AppQu-v${{ env.VERSION_NAME }}.apk"
          }
          EOF

      - name: 6. Install Dependencies & Build Web App
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build
          cp public/version.json dist/version.json 2>/dev/null || true

      - name: 7. Sinkronisasi Platform Android Native (Capacitor)
        run: |
          # Buat platform android jika belum ada
          if [ ! -d "android" ]; then
            echo "Membuat platform android native via Capacitor..."
            npx cap add android
          fi

          echo "Menyinkronkan aset web ke Android..."
          npx cap sync android

          # Pastikan variabel gradle kompatibel dengan SDK 35
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          # Optimasi memori gradle agar lancar di runner gratis GitHub
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Beri izin eksekusi gradlew
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true

      - name: 8. Setup Keystore Debug Konsisten (Multi-Account & Auto-Update Compatible)
        run: |
          mkdir -p ~/.android
          if [ -f "android/app/debug.keystore" ]; then
            echo "Menggunakan keystore permanen konsisten agar APK antar-akun GitHub dapat saling memperbarui (in-place update)..."
            cp android/app/debug.keystore ~/.android/debug.keystore
          else
            echo "Membuat keystore baru jika berkas belum ada..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore android/app/debug.keystore 2>/dev/null || true
          fi

      - name: 9. Kompilasi APK dengan Gradle
        run: |
          chmod +x android/gradlew gradlew
          cd android
          ./gradlew assembleDebug \
            -PappVersionCode=${{ env.VERSION_CODE }} \
            -PappVersionName=${{ env.VERSION_NAME }} \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint
          cd ..

      - name: 10. Siapkan & Verifikasi Berkas APK
        run: |
          mkdir -p output-apk
          APK_FILE=""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*debug.apk" -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            # Salin dengan nama standar rilis
            cp "$APK_FILE" "output-apk/AppQu-v${{ env.VERSION_NAME }}.apk"
            cp "$APK_FILE" "output-apk/AppQu-latest.apk"
            cp "$APK_FILE" "output-apk/BaksoQu-POS-v${{ env.VERSION_NAME }}.apk"
            cp public/version.json output-apk/version.json

            echo "========================================="
            echo "✅ APK Berhasil dibuat & siap dirilis:"
            ls -lh output-apk/
            echo "SHA256 Checksums:"
            sha256sum output-apk/*.apk
            echo "========================================="
          else
            echo "❌ ERROR: File APK tidak ditemukan di build outputs!"
            find . -name "*.apk" || true
            exit 1
          fi

      - name: 11. Upload APK Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: AppQu-APK-v${{ env.VERSION_NAME }}
          path: output-apk/*
          retention-days: 30

      - name: 12. Buat GitHub Release Otomatis (Auto Release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "AppQu & BaksoQu POS v${{ env.VERSION_NAME }}"
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 AppQu & BaksoQu POS — Rilis Otomatis v${{ env.VERSION_NAME }}

            Pembaruan aplikasi resmi hasil kompilasi otomatis GitHub Actions CI/CD (100% Free & Open Source).

            ### 📦 Berkas Unduhan APK:
            * **[⬇️ Unduh AppQu-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/AppQu-v${{ env.VERSION_NAME }}.apk)** *(Aplikasi Ekosistem Warga, Lapak UMKM & POS Kasir)*
            * **[⬇️ Unduh AppQu-latest.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/AppQu-latest.apk)** *(Tautan Cepat Permanen Versi Terbaru)*
            * **[⬇️ Unduh BaksoQu-POS-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/BaksoQu-POS-v${{ env.VERSION_NAME }}.apk)**

            ### 📋 Informasi Rilis:
            * **Version Name:** `${{ env.VERSION_NAME }}`
            * **Version Code:** `${{ env.VERSION_CODE }}`
            * **Tanggal Rilis:** `${{ env.BUILD_DATE }}`
            * **Commit:** `${{ env.SHORT_SHA }}`
            * **Repository:** `${{ github.repository }}`

            ### 🚀 Catatan & Fitur Lengkap:
            * **Auto Version, Auto Action & Auto Release:** Cukup jalankan `git push origin main` dan APK langsung rilis otomatis.
            * **In-App Auto Update:** Peringatan pembaruan & unduh langsung 1-klik di dalam aplikasi.
            * **100% Free:** Dibangun dengan GitHub Actions Ubuntu Runner gratis tanpa biaya lisensi.
            * **Ekosistem Lengkap:** PaguyubanQu (Sosial & Kas), WargaQu (Buku Induk Digital), UsahaQu (Lapak UMKM, POS BaksoQu, BengkelQu, KlinikQu, RitelQu), SiagaQu (Tombol Darurat SOS), AreaQu & ChatQu.
            * **Cetak Struk Thermal:** Dukungan Bluetooth ESC/POS 58mm & 80mm untuk nota kasir dan dapur.

            ---
            *Dibuat otomatis oleh GitHub Actions CI/CD.*
          files: |
            output-apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
